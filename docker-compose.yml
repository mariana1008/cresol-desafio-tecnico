services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contacorrente
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d contacorrente"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/contacorrente
      DB_USER: app
      DB_PASSWORD: app
      DB_POOL_SIZE: "10"
    depends_on:
      postgres:
        condition: service_healthy